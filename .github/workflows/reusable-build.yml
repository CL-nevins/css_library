name: Reusable Build

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

jobs:
  build:
    name: Reusable Build - ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Build target
        run: |
          echo "building target=${{ inputs.target }}"
          sleep 6

  package:
    name: Reusable Package - ${{ inputs.target }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Package target
        run: |
          echo "packaging target=${{ inputs.target }}"
          sleep 4
