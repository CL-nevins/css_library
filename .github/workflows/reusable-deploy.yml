name: Reusable Deploy

on:
  workflow_call:
    inputs:
      env_name:
        required: true
        type: string

jobs:
  deploy:
    name: Reusable Deploy - ${{ inputs.env_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: |
          echo "deploying env=${{ inputs.env_name }}"
          sleep 5

  verify:
    name: Reusable Verify - ${{ inputs.env_name }}
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify deploy
        run: |
          echo "verifying env=${{ inputs.env_name }}"
          sleep 3
