name: DAG Demo With Matrix And Uses

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  prepare:
    name: 1. Prepare
    runs-on: ubuntu-latest
    steps:
      - name: Prepare workspace
        run: |
          echo "prepare"
          sleep 5
  prepare_single:
    name: 1. Prepare-Single
    runs-on: ubuntu-latest
    steps:
      - name: Prepare workspace single
        run: |
          echo "prepare single"
          sleep 5
  lint:
    name: 2. Lint
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Run lint
        run: |
          echo "lint"
          sleep 5

  unit_test:
    name: 3. Unit Test
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Run unit tests
        run: |
          echo "unit test"
          sleep 8

  e2e_test:
    name: 4. E2E Test
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Run e2e tests
        run: |
          echo "e2e test"
          sleep 8

  matrix_test:
    name: 5. Matrix Test - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit_test
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Print matrix value
        run: |
          echo "node-version=${{ matrix.node-version }}"
          sleep 6

  build_web:
    name: 6. Build Web
    needs:
      - matrix_test
    uses: ./.github/workflows/reusable-build.yml
    with:
      target: web

  build_server:
    name: 7. Build Server
    needs:
      - matrix_test
    uses: ./.github/workflows/reusable-build.yml
    with:
      target: server

  integration_test:
    name: 8. Integration Test
    runs-on: ubuntu-latest
    needs:
      - build_web
      - build_server
      - e2e_test
    steps:
      - name: Run integration test
        run: |
          echo "integration test"
          sleep 6

  deploy_staging:
    name: 9. Deploy Staging
    needs:
      - integration_test
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      env_name: staging

  smoke_test:
    name: 10. Smoke Test
    runs-on: ubuntu-latest
    needs: deploy_staging
    steps:
      - name: Run smoke test
        run: |
          echo "smoke test"
          sleep 5

  deploy_prod:
    name: 11. Deploy Production
    needs:
      - smoke_test
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      env_name: production
